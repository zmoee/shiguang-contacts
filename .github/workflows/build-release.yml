name: Build signed release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools were not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHIGUANG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing SHIGUANG_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shiguang-release.p12"

      - name: Assemble signed release APK
        env:
          SHIGUANG_KEYSTORE_PATH: ${{ runner.temp }}/shiguang-release.p12
          SHIGUANG_KEYSTORE_PASSWORD: ${{ secrets.SHIGUANG_KEYSTORE_PASSWORD }}
          SHIGUANG_KEY_ALIAS: ${{ secrets.SHIGUANG_KEY_ALIAS }}
          SHIGUANG_KEY_PASSWORD: ${{ secrets.SHIGUANG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/Shiguang-Contacts-1.0.0.apk"
          sha256sum "artifacts/Shiguang-Contacts-1.0.0.apk" | tee artifacts/Shiguang-Contacts-1.0.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-contacts-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
